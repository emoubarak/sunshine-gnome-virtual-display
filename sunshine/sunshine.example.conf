# Settings this project relies on (merge into ~/.config/sunshine/sunshine.conf).
# Capture the virtual connector directly through KMS (no portal prompt on Wayland).
capture = kms
output_name = @CONNECTOR@
# VAAPI shown here (AMD/Intel). Pin the render node with a stable link when the machine has several
# GPUs, see sunshine/99-sunshine-render.rules.example.
encoder = vaapi
adapter_name = /dev/dri/sunshine-render
# Constant bitrate with a one-frame buffer: steady latency on Wi-Fi, no bursts that drop frames.
vaapi_rc = cbr
vaapi_strict_rc_buffer = enabled
# Leave the packet size to the client: 1392 on the LAN, 1024 through a VPN (Moonlight decides).
packetsize = 0
# Quicker recovery when the client vanishes.
ping_timeout = 5000
