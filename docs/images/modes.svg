<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="The three Moonlight entries: Extend, Virtual only, Remote">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #ecf1f5; }
    .title { font-size: 19px; font-weight: 600; }
    .line { font-size: 14px; fill: #8c9ba8; }
    .label { font-size: 13px; fill: #8c9ba8; }
    .accent { fill: #4dd1c5; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #121b24; stroke: #223040; stroke-width: 1.5; }
    .phys { fill: #18222c; stroke: #8c9ba8; stroke-width: 2; }
    .wall { fill: #263440; }
    .off { fill: #0f161d; stroke: #3a4856; stroke-width: 2; }
    .virt { fill: #0e151c; stroke: #4dd1c5; stroke-width: 2; stroke-dasharray: 6 4; }
    .vwall { fill: #26605c; }
    .bar { fill: #080c11; }
    .stand { fill: #8c9ba8; }
    .standoff { fill: #3a4856; }
  </style>
  <rect width="880" height="300" rx="12" fill="#0e151c"/>

  <!-- Extend -->
  <rect class="panel" x="20" y="20" width="272" height="260" rx="10"/>
  <text class="title" x="40" y="56">Extend</text>
  <rect class="phys" x="48" y="92" width="116" height="66" rx="4"/>
  <rect class="wall" x="53" y="97" width="106" height="56"/>
  <rect class="stand" x="101" y="158" width="10" height="9"/>
  <rect class="stand" x="86" y="166" width="40" height="4" rx="2"/>
  <rect class="virt" x="164" y="97" width="84" height="56" rx="3"/>
  <rect class="vwall" x="168" y="101" width="76" height="48"/>
  <rect class="bar" x="168" y="101" width="76" height="6"/>
  <text class="label" x="106" y="192" text-anchor="middle">monitor</text>
  <text class="label accent" x="206" y="192" text-anchor="middle">virtual</text>
  <text class="line" x="40" y="236">your monitors + the virtual one</text>
  <text class="line" x="40" y="258">the virtual one is primary</text>

  <!-- Virtual only -->
  <rect class="panel" x="304" y="20" width="272" height="260" rx="10"/>
  <text class="title" x="324" y="56">Virtual only</text>
  <rect class="off" x="332" y="92" width="116" height="66" rx="4"/>
  <text class="label" x="390" y="130" text-anchor="middle">off</text>
  <rect class="standoff" x="385" y="158" width="10" height="9"/>
  <rect class="standoff" x="370" y="166" width="40" height="4" rx="2"/>
  <rect class="virt" x="464" y="97" width="84" height="56" rx="3"/>
  <rect class="vwall" x="468" y="101" width="76" height="48"/>
  <rect class="bar" x="468" y="101" width="76" height="6"/>
  <text class="label" x="390" y="192" text-anchor="middle">monitor</text>
  <text class="label accent" x="506" y="192" text-anchor="middle">virtual</text>
  <text class="line" x="324" y="236">the virtual monitor alone</text>
  <text class="line" x="324" y="258">at the client's mode</text>

  <!-- Remote -->
  <rect class="panel" x="588" y="20" width="272" height="260" rx="10"/>
  <text class="title" x="608" y="56">Remote</text>
  <rect class="off" x="616" y="92" width="116" height="66" rx="4"/>
  <text class="label" x="674" y="130" text-anchor="middle">off</text>
  <rect class="standoff" x="669" y="158" width="10" height="9"/>
  <rect class="standoff" x="654" y="166" width="40" height="4" rx="2"/>
  <rect class="virt" x="748" y="97" width="84" height="56" rx="3"/>
  <rect class="vwall" x="752" y="101" width="76" height="48"/>
  <rect class="bar" x="752" y="101" width="76" height="6"/>
  <circle cx="790" cy="129" r="3.5" fill="#4dd1c5"/>
  <path d="M797 120 A12 12 0 0 1 797 138 M803 114 A20 20 0 0 1 803 144" fill="none" stroke="#ecf1f5" stroke-width="2" stroke-linecap="round"/>
  <text class="label" x="674" y="192" text-anchor="middle">monitor</text>
  <text class="label accent mono" x="790" y="192" text-anchor="middle">60 Hz</text>
  <text class="line" x="608" y="236">the virtual monitor alone</text>
  <text class="line" x="608" y="258">for streams over the internet</text>
</svg>
