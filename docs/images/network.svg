<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Two Wi-Fi hops; VPN address versus LAN address with stream-qos">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #ecf1f5; }
    .title { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: #8c9ba8; }
    .line { font-size: 14px; fill: #c5cfd8; }
    .lab { font-size: 13px; fill: #8c9ba8; }
    .laba { font-size: 13px; fill: #4dd1c5; }
    .labm { font-size: 13px; fill: #f0b35b; }
    .big { font-size: 22px; font-weight: 700; }
    .box { fill: #141d26; stroke: #3a4a58; stroke-width: 1.5; }
    .card { fill: #121b24; stroke: #223040; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4dd1c5"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0b35b"/></marker>
  </defs>
  <rect width="880" height="420" rx="12" fill="#0e151c"/>

  <!-- The path -->
  <rect class="box" x="40" y="104" width="170" height="64" rx="8"/>
  <text class="title" x="58" y="132">Host</text>
  <text class="sub" x="58" y="152">Sunshine, downloads</text>

  <rect class="box" x="355" y="104" width="170" height="64" rx="8"/>
  <text class="title" x="373" y="132">Access point</text>
  <text class="sub" x="373" y="152">one Wi-Fi channel</text>

  <rect class="box" x="670" y="104" width="170" height="64" rx="8"/>
  <text class="title" x="688" y="132">Client</text>
  <text class="sub" x="688" y="152">Moonlight</text>

  <rect class="box" x="355" y="20" width="170" height="44" rx="22"/>
  <text class="title" x="440" y="48" text-anchor="middle">Internet</text>

  <path fill="none" stroke="#4dd1c5" stroke-width="2.5" marker-end="url(#teal)" d="M210 126 H351"/>
  <text class="laba" x="280" y="117" text-anchor="middle">stream, hop 1</text>
  <path fill="none" stroke="#f0b35b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)" d="M355 148 H214"/>
  <text class="labm" x="282" y="190" text-anchor="middle">downloads, same airtime</text>
  <path fill="none" stroke="#4dd1c5" stroke-width="2.5" marker-end="url(#teal)" d="M525 136 H666"/>
  <text class="laba" x="596" y="127" text-anchor="middle">stream, hop 2</text>
  <path fill="none" stroke="#f0b35b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)" d="M440 64 V100"/>

  <!-- 1. VPN address -->
  <rect class="card" x="40" y="222" width="390" height="174" rx="10"/>
  <text class="title" x="60" y="252" fill="#f0b35b">Host reached through its VPN address</text>
  <text class="line" x="60" y="282">1024-byte video packets</text>
  <text class="line" x="60" y="306">no DSCP marks: no Wi-Fi priority</text>
  <text class="line" x="60" y="330">downloads take the airtime</text>
  <text class="big" x="60" y="374" fill="#f0b35b">42 ms</text>
  <text class="lab" x="136" y="373">network latency, downloads running</text>

  <!-- 2. LAN address and stream-qos -->
  <rect class="card" x="450" y="222" width="390" height="174" rx="10"/>
  <text class="title" x="470" y="252" fill="#4dd1c5">LAN address + stream-qos</text>
  <text class="line" x="470" y="282">1392-byte packets, DSCP 40 video, 48 audio</text>
  <text class="line" x="470" y="306">internet TCP shaped to 40 Mbit/s</text>
  <text class="line" x="470" y="330">(CAKE, shared per connection)</text>
  <text class="big" x="470" y="374" fill="#4dd1c5">5 to 9 ms</text>
  <text class="lab" x="582" y="373">same downloads</text>
</svg>
