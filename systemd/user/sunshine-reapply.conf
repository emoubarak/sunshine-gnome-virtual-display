# Drop-in for the Sunshine user unit (installed as <unit>.d/gnome-virtual-display.conf).
# Re-applies the last requested mode before Sunshine enumerates the outputs. Sunshine's KMS capture
# makes Mutter re-enumerate the outputs, which can drop the physical monitor, so the layout is
# applied once more after the capture started. The leading "-" never blocks Sunshine.
[Service]
ExecStartPre=-%h/.local/bin/gnome-virtual-display reapply
ExecStartPost=-/bin/sh -c 'sleep 4; exec %h/.local/bin/gnome-virtual-display reapply'
